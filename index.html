
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OliwkaLab</title>
<script type="module">
import { createAvatar } from "https://esm.sh/@dicebear/core@9";
import { adventurer } from "https://esm.sh/@dicebear/collection@9";
window.generateAvatarSvg = function(seed) {
 return createAvatar(adventurer, { seed: seed, size: 200 }).toString();
};
window.dicebearReady = true;
if (window.onDicebearReady) window.onDicebearReady();
</script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: linear-gradient(180deg, #FFE8B5, #FFD6E8); margin: 0; padding: 0; color: #3A2E5C; min-height: 100vh; }
header { background: linear-gradient(135deg, #FF9E7D, #B36BFF); color: white; padding: 16px; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
header h1 { margin: 0; font-size: 24px; }
.container { max-width: 640px; margin: 0 auto; padding: 16px; }
.card { background: white; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
input[type=text] { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid #FFD6E8; font-size: 17px; margin-bottom: 12px; text-align: center; }
input[type=text]:focus { outline: none; border-color: #B36BFF; }
button.big { background: linear-gradient(135deg, #FF9E7D, #B36BFF); color: white; border: none; border-radius: 16px; padding: 16px 24px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 0 #9548d6; transition: transform 0.1s; }
button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #9548d6; }
button.ghost { background: white; color: #B36BFF; border: 2px solid #B36BFF; box-shadow: none; }
.avatar-wrap { position: relative; width: 200px; height: 200px; margin: 10px auto; }
.avatar-wrap img, .avatar-wrap svg { width: 200px; height: 200px; }
.equip-icon { position: absolute; font-size: 34px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }

.crystals-badge { display: inline-flex; align-items: center; gap: 6px; background: #FFF3D6; color: #C9820B; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 15px; }
.subject-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.subject-btn { background: white; border: 3px solid #FFD6E8; border-radius: 18px; padding: 20px 10px; text-align: center; cursor: pointer; font-weight: 700; color: #3A2E5C; transition: transform 0.15s, border-color 0.15s; }
.subject-btn:hover { transform: translateY(-3px); border-color: #B36BFF; }
.subject-btn.disabled { opacity: 0.4; cursor: not-allowed; }
.subject-icon { font-size: 40px; display: block; margin-bottom: 8px; }
.topic-btn { display: block; width: 100%; background: #FFF6EE; border: 2px solid #FFD6E8; border-radius: 14px; padding: 16px; margin-bottom: 10px; text-align: left; cursor: pointer; font-size: 15px; font-weight: 600; color: #3A2E5C; }
.back-link { background: none; border: none; color: #B36BFF; font-weight: 700; font-size: 15px; cursor: pointer; margin-bottom: 12px; padding: 0; }
.sentence-box { font-size: 20px; text-align: center; margin: 20px 0; line-height: 1.6; }
.hint-box { background: #E8F7EE; border-radius: 12px; padding: 12px; font-size: 13px; color: #2E7D4F; margin-top: 10px; }
.feedback { text-align: center; font-weight: 700; font-size: 18px; margin: 14px 0; }
.feedback.ok { color: #2E7D4F; }
.feedback.bad { color: #D6336C; }
.progress-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #FFD6E8; }
.dot.filled { background: #B36BFF; }
.result-emoji { font-size: 60px; text-align: center; margin: 10px 0; }
.stat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.stat-label { width: 90px; font-size: 13px; font-weight: 700; }
.stat-bar-bg { flex: 1; background: #FFE8D6; border-radius: 8px; height: 14px; overflow: hidden; }
.stat-bar-fill { height: 100%; background: linear-gradient(90deg, #FF9E7D, #B36BFF); }
.stat-val { width: 30px; text-align: right; font-size: 12px; color: #888; }
.wardrobe-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.wardrobe-item { background: #FFF6EE; border: 3px solid #FFD6E8; border-radius: 14px; padding: 12px 4px; text-align: center; font-size: 30px; cursor: pointer; position: relative; }
.wardrobe-item.equipped { border-color: #B36BFF; background: #F3E6FF; }
.wardrobe-item.locked { opacity: 0.3; cursor: not-allowed; }
.wardrobe-item small { display: block; font-size: 9px; color: #888; margin-top: 4px; }
@media (max-width: 480px) {
 .subject-grid { grid-template-columns: 1fr; }
 .wardrobe-grid { grid-template-columns: repeat(3, 1fr); }
 header h1 { font-size: 19px; }
}
</style>
</head>
<body>
<header><h1>✨ OliwkaLab ✨</h1></header>
<div class="container" id="app"></div>

<script>
var NAME_KEY = "oliwkalab_name";
var CRYSTALS_KEY = "oliwkalab_crystals";
var STATS_KEY = "oliwkalab_stats";
var AVATAR_SEED_KEY = "oliwkalab_avatar_seed";
var UNLOCKED_KEY = "oliwkalab_unlocked";
var EQUIPPED_KEY = "oliwkalab_equipped";

var RZ_ZASADY = [
{"id":1,"sentence":"Przed oknem rośnie duże d___ewo.","answer":"rz","hint":"drzewo - drzewa (rz po spółgłosce d)"},
{"id":2,"sentence":"Na stole leży pusty tale___.","answer":"rz","hint":"talerz - talerzyk (rz wymienia się na r)"},
{"id":3,"sentence":"W ogrodzie kwitną piękne ró___e.","answer":"ż","hint":"róża - wyjątek do zapamiętania"},
{"id":4,"sentence":"Nad brzegiem ___eki siedzi wędkarz.","answer":"rz","hint":"rzeka - rzeczka (rz zostaje w rodzinie wyrazów)"},
{"id":5,"sentence":"Wa___ka lata nad jeziorem.","answer":"ż","hint":"ważka - waga (ż wymienia się na g)"},
{"id":6,"sentence":"Je___ zwinął się w kłębek pod krzakiem.","answer":"ż","hint":"jeż - jeże, wyjątek do zapamiętania"},
{"id":7,"sentence":"Dziewczynka w___uciła piłkę do kosza.","answer":"rz","hint":"wrzucić - wrzucać (rz po spółgłosce w)"},
{"id":8,"sentence":"W lesie rośnie du___o grzybów.","answer":"ż","hint":"dużo - duża (ż zostaje w rodzinie wyrazów)"},
{"id":9,"sentence":"Górnik pracuje w kopalni pod z___emią.","answer":"i","hint":"ziemia - ziemniak (kontrolne, nie rz/ż)"},
{"id":10,"sentence":"Na polu pasą się cztery k___owy.","answer":"r","hint":"krowy - krowa (kontrolne, nie rz/ż)"}
];

var WARDROBE_ITEMS = [
 { id: "korona", name: "Złota korona", icon: "👑", slot: "hat", unlockAt: 0 },
 { id: "czapka_kowboj", name: "Czapka kowboja", icon: "🤠", slot: "hat", unlockAt: 20 },
 { id: "hełm_smoka", name: "Hełm smoka", icon: "🐉", slot: "hat", unlockAt: 60 },
 { id: "miecz", name: "Świetlisty miecz", icon: "🗡", slot: "weapon", unlockAt: 10 },
 { id: "krowi_placek", name: "Krowi placek (broń!)", icon: "💩", slot: "weapon", unlockAt: 30 },
 { id: "różdżka", name: "Magiczna różdżka", icon: "🪄", slot: "weapon", unlockAt: 80 },
 { id: "tarcza", name: "Tarcza obrońcy", icon: "🛡", slot: "shield", unlockAt: 15 },
 { id: "parasol", name: "Śmieszny parasol", icon: "☂", slot: "shield", unlockAt: 40 },
 { id: "patelnia", name: "Patelnia bojowa", icon: "🍳", slot: "shield", unlockAt: 70 }
];

function getName() { return localStorage.getItem(NAME_KEY) || ""; }
function setName(n) { localStorage.setItem(NAME_KEY, n); }
function getCrystals() { return parseInt(localStorage.getItem(CRYSTALS_KEY) || "0", 10); }
function addCrystals(n) { localStorage.setItem(CRYSTALS_KEY, String(getCrystals() + n)); checkUnlocks(); }

function getStats() {
 var raw = localStorage.getItem(STATS_KEY);
 return raw ? JSON.parse(raw) : { sila: 0, umysl: 0, cialo: 0, atak: 0, obrona: 0 };
}
function addStat(name, n) {
 var s = getStats();
 s[name] = (s[name] || 0) + n;
 localStorage.setItem(STATS_KEY, JSON.stringify(s));
}

function getAvatarSeed() { return localStorage.getItem(AVATAR_SEED_KEY) || ""; }
function setAvatarSeed(seed) { localStorage.setItem(AVATAR_SEED_KEY, seed); }

function getUnlocked() {
 var raw = localStorage.getItem(UNLOCKED_KEY);
 return raw ? JSON.parse(raw) : [];
}
function setUnlocked(arr) { localStorage.setItem(UNLOCKED_KEY, JSON.stringify(arr)); }
function getEquipped() {
 var raw = localStorage.getItem(EQUIPPED_KEY);
 return raw ? JSON.parse(raw) : {};
}
function setEquipped(obj) { localStorage.setItem(EQUIPPED_KEY, JSON.stringify(obj)); }

function checkUnlocks() {
 var crystals = getCrystals();
 var unlocked = getUnlocked();
 WARDROBE_ITEMS.forEach(function(item) {
 if (crystals >= item.unlockAt && unlocked.indexOf(item.id) === -1) {
 unlocked.push(item.id);
 }
 });
 setUnlocked(unlocked);
}

var app = document.getElementById("app");
function render(view) {
 app.classList.remove("fade-in");
 app.innerHTML = "";
 view();
 void app.offsetWidth;
 app.classList.add("fade-in");
}

function crystalsBadge() {
 return '<div class="crystals-badge">💎 ' + getCrystals() + ' Iskier Wiedzy</div>';
}


var POSE_ANCHORS = {
 idle:  { headTop: "8px",  headLeft: "50%", handRight: "18px", handBottom: "55px" },
 think: { headTop: "14px", headLeft: "46%", handRight: "22px", handBottom: "60px" },
 cheer: { headTop: "2px",  headLeft: "50%", handRight: "5px",  handBottom: "35px" }
};

function getCurrentMood() {
 var lastActivity = localStorage.getItem("oliwkalab_last_activity");
 if (!lastActivity) return "idle";
 var days = Math.floor((Date.now() - new Date(lastActivity).getTime()) / (1000*60*60*24));
 if (days >= 2) return "think";
 return "idle";
}

function drawAvatar(container, moodOverride) {
 var mood = moodOverride || getCurrentMood();
 var fileMap = { idle: "character_femaleAdventurer_idle.png", think: "character_femaleAdventurer_think.png", cheer: "character_femaleAdventurer_cheer1.png" };
 container.innerHTML = '<img src="' + fileMap[mood] + '" style="width:100%;height:100%;object-fit:contain;">';
 container.setAttribute("data-mood", mood);
}

function markActivityToday() {
 localStorage.setItem("oliwkalab_last_activity", new Date().toISOString());
}



function equipOverlayHtml(mood) {
 var anchors = POSE_ANCHORS[mood || "idle"];
 var equipped = getEquipped();
 var html = "";
 WARDROBE_ITEMS.forEach(function(item) {
 if (equipped[item.slot] !== item.id) return;
 var style = "";
 if (item.slot === "hat") {
 style = "top:" + anchors.headTop + ";left:" + anchors.headLeft + ";transform:translateX(-50%);";
 } else {
 style = "bottom:" + anchors.handBottom + ";right:" + anchors.handRight + ";";
 }
 html += '<div class="equip-icon" style="' + style + '">' + item.icon + '</div>';
 });
 return html;
}


function renderWelcome() {
 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<h2 style="text-align:center;">Witaj, Odkrywco!</h2>' +
 '<p style="text-align:center;color:#666;">Jak masz na imię?</p>' +
 '<input type="text" id="nameInput" placeholder="Wpisz swoje imię">' +
 '<button class="big" id="startBtn">Zaczynamy przygodę!</button>';
 app.appendChild(card);
 document.getElementById("startBtn").onclick = function() {
 var val = document.getElementById("nameInput").value.trim();
 if (!val) { return; }
 setName(val);
 setAvatarSeed(val + Date.now());
 render(renderAvatarPicker);
 };
}

function renderAvatarPicker() {
 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<h2 style="text-align:center;">Wybierz swój wygląd!</h2>' +
 '<div class="avatar-wrap" id="avatarWrap"></div>' +
 '<button class="big ghost" id="rerollBtn" style="margin-bottom:10px;">🎲 Inny wygląd</button>' +
 '<button class="big" id="confirmAvatarBtn">To jestem ja! ✅</button>';
 app.appendChild(card);
 var wrap = document.getElementById("avatarWrap");
 drawAvatar(wrap);
 document.getElementById("rerollBtn").onclick = function() {
 setAvatarSeed(getName() + Math.random());
 drawAvatar(wrap);
 };
 document.getElementById("confirmAvatarBtn").onclick = function() {
 render(renderHome);
 };
}

function renderHome() {
 var name = getName();
 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<div style="text-align:center;">' + crystalsBadge() + '</div>' +

 '<div class="avatar-wrap" id="avatarWrap"></div>' +

 '<h2 style="text-align:center;">Cześć, ' + name + '!</h2>' +
 '<button class="big ghost" id="charBtn">🎽 Mój bohater</button>';
 app.appendChild(card);

 var wrapEl = document.getElementById("avatarWrap");
 drawAvatar(wrapEl);
 wrapEl.innerHTML += equipOverlayHtml(wrapEl.getAttribute("data-mood"));

 document.getElementById("charBtn").onclick = function() { render(renderCharacter); };

 var subjCard = document.createElement("div");
 subjCard.className = "card";
 subjCard.innerHTML = '<div class="subject-grid" id="subjectGrid"></div>';
 app.appendChild(subjCard);

 var grid = document.getElementById("subjectGrid");
 var subjects = [
 { name: "Polski", icon: "📖", active: true },
 { name: "Matematyka", icon: "🔢", active: false },
 { name: "Angielski", icon: "🌍", active: false },
 { name: "Przyroda", icon: "🌱", active: false }
 ];
 subjects.forEach(function(s) {
 var b = document.createElement("div");
 b.className = "subject-btn" + (s.active ? "" : " disabled");
 b.innerHTML = '<span class="subject-icon">' + s.icon + '</span>' + s.name + (s.active ? "" : "<br><small>(wkrótce)</small>");
 if (s.active) { b.onclick = function() { render(renderPolski); }; }
 grid.appendChild(b);
 });
}

function renderCharacter() {
 var back = document.createElement("button");
 back.className = "back-link";
 back.textContent = "← Powrót";
 back.onclick = function() { render(renderHome); };
 app.appendChild(back);

 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<div style="text-align:center;">' + crystalsBadge() + '</div>' +
 '<div class="avatar-wrap" id="avatarWrap2"></div>';
 app.appendChild(card);
 drawAvatar(document.getElementById("avatarWrap2"));
 document.getElementById("avatarWrap2").innerHTML += equipOverlayHtml();

 var stats = getStats();
 var statsCard = document.createElement("div");
 statsCard.className = "card";
 var statDefs = [
 { key: "sila", label: "Siła", icon: "💪" },
 { key: "umysl", label: "Umysł", icon: "🧠" },
 { key: "cialo", label: "Ciało", icon: "🏃" },
 { key: "atak", label: "Atak", icon: "⚔" },
 { key: "obrona", label: "Obrona", icon: "🛡" }
 ];
 var html = "<h3 style='margin-top:0;'>Statystyki</h3>";
 statDefs.forEach(function(sd) {
 var val = stats[sd.key] || 0;
 var pct = Math.min(100, val);
 html += '<div class="stat-row"><span class="stat-label">' + sd.icon + ' ' + sd.label + '</span><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:' + pct + '%"></div></div><span class="stat-val">' + val + '</span></div>';
 });
 statsCard.innerHTML = html;
 app.appendChild(statsCard);

 var wardrobeBtn = document.createElement("button");
 wardrobeBtn.className = "big";
 wardrobeBtn.textContent = "👗 Otwórz szafę";
 wardrobeBtn.onclick = function() { render(renderWardrobe); };
 app.appendChild(wardrobeBtn);
}

function renderWardrobe() {
 var back = document.createElement("button");
 back.className = "back-link";
 back.textContent = "← Powrót";
 back.onclick = function() { render(renderCharacter); };
 app.appendChild(back);

 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML = '<h2 style="text-align:center;">Twoja szafa</h2><div class="wardrobe-grid" id="wardrobeGrid"></div>';
 app.appendChild(card);

 var grid = document.getElementById("wardrobeGrid");
 var unlocked = getUnlocked();
 var equipped = getEquipped();
 WARDROBE_ITEMS.forEach(function(item) {
 var isUnlocked = unlocked.indexOf(item.id) !== -1;
 var isEquipped = equipped[item.slot] === item.id;
 var div = document.createElement("div");
 div.className = "wardrobe-item" + (isEquipped ? " equipped" : "") + (isUnlocked ? "" : " locked");
 div.innerHTML = item.icon + "<small>" + (isUnlocked ? item.name : "💎 " + item.unlockAt) + "</small>";
 if (isUnlocked) {
 div.onclick = function() {
 var eq = getEquipped();
 if (eq[item.slot] === item.id) { delete eq[item.slot]; }
 else { eq[item.slot] = item.id; }
 setEquipped(eq);
 render(renderWardrobe);
 };
 }
 grid.appendChild(div);
 });
}

function renderPolski() {
 var back = document.createElement("button");
 back.className = "back-link";
 back.textContent = "← Powrót";
 back.onclick = function() { render(renderHome); };
 app.appendChild(back);

 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML = '<h2>📖 Język polski</h2><p style="color:#666;">Wybierz zadanie:</p>';
 app.appendChild(card);

 var listCard = document.createElement("div");
 listCard.className = "card";
 var topics = [
 { name: "🔤 Zasady pisowni: rz czy ż", action: function() { render(function() { startRzZExercise(); }); } },
 { name: "📌 Aktualny temat (wkrótce)", action: null },
 { name: "🎤 Dyktando (wkrótce)", action: null },
 { name: "📚 Lektury (wkrótce)", action: null }
 ];
 topics.forEach(function(t) {
 var b = document.createElement("button");
 b.className = "topic-btn";
 b.textContent = t.name;
 if (t.action) { b.onclick = t.action; }
 else { b.style.opacity = "0.5"; b.style.cursor = "not-allowed"; }
 listCard.appendChild(b);
 });
 app.appendChild(listCard);
}

function startRzZExercise() {
 var queue = RZ_ZASADY.slice();
 var idx = 0;
 var correctCount = 0;

 function draw() {
 app.innerHTML = "";
 var back = document.createElement("button");
 back.className = "back-link";
 back.textContent = "← Przerwij i wróć";
 back.onclick = function() { render(renderPolski); };
 app.appendChild(back);

 if (idx >= queue.length) {
 var earned = correctCount * 5;

 addCrystals(earned);
 addStat("umysl", correctCount);
 markActivityToday();

 var doneCard = document.createElement("div");
 doneCard.className = "card";
 doneCard.innerHTML =
 '<div class="result-emoji">' + (correctCount >= 8 ? "🏆" : correctCount >= 5 ? "🎉" : "💪") + '</div>' +
 '<h2 style="text-align:center;">Quest ukończony!</h2>' +
 '<p style="text-align:center;">Poprawne odpowiedzi: ' + correctCount + ' / ' + queue.length + '</p>' +
 '<p style="text-align:center;font-weight:700;color:#C9820B;">Zdobyto ' + earned + ' Iskier Wiedzy! 💎</p>' +
 '<p style="text-align:center;font-size:13px;color:#888;">+' + correctCount + ' do Umysłu 🧠</p>' +
 '<button class="big" id="finishBtn">Powrót do menu</button>';
 app.appendChild(doneCard);
 document.getElementById("finishBtn").onclick = function() { render(renderPolski); };
 return;
 }

 var dotsCard = document.createElement("div");
 dotsCard.className = "progress-dots";
 for (var i = 0; i < queue.length; i++) {
 dotsCard.innerHTML += '<div class="dot' + (i < idx ? " filled" : "") + '"></div>';
 }
 app.appendChild(dotsCard);

 var q = queue[idx];
 var card = document.createElement("div");
 card.className = "card";
 card.innerHTML =
 '<div class="sentence-box">' + q.sentence + '</div>' +
 '<input type="text" id="rzInput" placeholder="Wpisz brakujące litery">' +
 '<button class="big" id="checkBtn">Sprawdź</button>' +
 '<div id="feedbackArea"></div>';
 app.appendChild(card);

 document.getElementById("checkBtn").onclick = function() {
 var val = document.getElementById("rzInput").value.trim().toLowerCase();
 var isCorrect = val.length > 0 && val === q.answer.toLowerCase();
 if (isCorrect) { correctCount++; }
 document.getElementById("checkBtn").disabled = true;
 document.getElementById("rzInput").disabled = true;
 var fb = document.getElementById("feedbackArea");
 fb.innerHTML =
 '<div class="feedback ' + (isCorrect ? "ok" : "bad") + '">' + (isCorrect ? "Super! Dobrze! 🎉" : "Prawie! Poprawna odpowiedź: " + q.answer) + '</div>' +
 '<div class="hint-box">💡 ' + q.hint + '</div>';
 var nextBtn = document.createElement("button");
 nextBtn.className = "big";
 nextBtn.style.marginTop = "10px";
 nextBtn.textContent = "Dalej →";
 nextBtn.onclick = function() { idx++; draw(); };
 fb.appendChild(nextBtn);
 };
 }
 draw();
}

document.addEventListener("keydown", function(e) {
 if (e.key !== "Enter") return;
 var input = document.getElementById("rzInput");
 if (!input) return;
 var checkBtn = document.getElementById("checkBtn");
 if (checkBtn && !checkBtn.disabled) { checkBtn.click(); return; }
 var buttons = document.querySelectorAll("button.big");
 for (var i = 0; i < buttons.length; i++) {
 if (buttons[i].textContent.indexOf("Dalej") !== -1) { buttons[i].click(); return; }
 }
});

checkUnlocks();
if (getName() && getAvatarSeed()) { render(renderHome); } else { render(renderWelcome); }
</script>
</body>
</html>
